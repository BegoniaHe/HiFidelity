# .swiftlint.yml
# Strict SwiftLint Configuration - Ensures only one code style passes

# Paths to exclude from linting
excluded:
  - build
  - .build
  - ThirdParty
  - HiFidelity/deps
  - DerivedData
  - .swiftpm
  - Packages

# Paths to include (optional, commented out means include all non-excluded)
# included:
#   - HiFidelity

# Enable all opt-in rules for maximum strictness
opt_in_rules:
  # Indentation and spacing
  - indentation_width
  - closure_spacing
  - closure_end_indentation
  - operator_usage_whitespace
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - vertical_whitespace_between_cases

  # Code quality
  - explicit_init
  - explicit_self
  - explicit_type_interface
  - explicit_acl
  - explicit_top_level_acl
  - redundant_type_annotation
  - explicit_enum_raw_value

  # Naming
  - prefixed_toplevel_constant
  - type_contents_order
  - file_name
  - file_name_no_space

  # Organization
  - sorted_imports
  - sorted_first_last
  - vertical_parameter_alignment_on_call
  - trailing_closure

  # Safety
  - force_unwrapping
  - force_try
  - force_cast
  - implicitly_unwrapped_optional
  - fatal_error_message
  - yoda_condition

  # Best practices
  - array_init
  - attributes
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - discouraged_optional_boolean
  - discouraged_optional_collection
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - fallthrough
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - number_separator
  - operator_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - private_subject
  - prohibited_super_call
  - raw_value_for_camel_cased_codable_enum
  - reduce_into
  - redundant_nil_coalescing
  - redundant_objc_attribute
  - single_test_class
  - static_operator
  - strict_fileprivate
  - strong_iboutlet_attribute
  - toggle_bool
  - trailing_comma
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - untyped_error_in_catch
  - vertical_parameter_alignment
  - vertical_whitespace
  - weak_delegate
  - xct_specific_matcher

# Disable rules that conflict with strict formatting
disabled_rules:
  - todo # Allow TODOs during development
  - multiple_closures_with_trailing_closure # Allow multiple trailing closures
  - empty_count
  - trailing_closure

# Rule configurations
analyzer_rules:
  - unused_declaration
  - unused_import

# Indentation - enforce 4 spaces (or 2 if you prefer)
indentation_width:
  indentation_width: 4
  include_comments: true
  include_compiler_directives: true
  include_multiline_strings: true

# Line length - strict but reasonable
line_length:
  warning: 120
  error: 150
  ignores_urls: true
  ignores_function_declarations: false
  ignores_comments: false
  ignores_interpolated_strings: true

# File length
file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

# Function body length
function_body_length:
  warning: 50
  error: 100

# Function parameter count
function_parameter_count:
  warning: 5
  error: 8

# Type body length
type_body_length:
  warning: 300
  error: 500

# Cyclomatic complexity
cyclomatic_complexity:
  warning: 10
  error: 20
  ignores_case_statements: false

# Nesting
nesting:
  type_level:
    warning: 2
    error: 3
  statement_level:
    warning: 5
    error: 10

# Identifier names
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 40
    error: 50
  excluded:
    - id
    - ID
    - url
    - URL
    - db
    - x
    - y
    - z
  validates_start_with_lowercase: true

type_name:
  min_length:
    warning: 3
    error: 2
  max_length:
    warning: 40
    error: 50
  validates_start_with_uppercase: true
  excluded:
    - ID

# Large tuple
large_tuple:
  warning: 3
  error: 4

# Trailing whitespace
trailing_whitespace:
  ignores_empty_lines: true
  ignores_comments: false

# Trailing comma
trailing_comma:
  mandatory_comma: true

# Vertical whitespace
vertical_whitespace:
  max_empty_lines: 2

# Multiline arguments
multiline_arguments:
  first_argument_location: next_line
  only_enforce_after_first_closure_on_first_line: false

# Multiline parameters
multiline_parameters:
  allows_single_line: false

# Closure spacing
closure_spacing:
  allow_single_line_closure: false

# Explicit type interface
explicit_type_interface:
  excluded:
    - local

# Number separator
number_separator:
  minimum_length: 5
  minimum_fraction_length: 5
  exclude_ranges: []

# File name
file_name:
  excluded:
    - main.swift
    - LinuxMain.swift
    - TestHelpers.swift
  prefix_pattern: ""
  suffix_pattern: '\\+.*'
  nested_type_separator: "."

# Modifier order
modifier_order:
  preferred_modifier_order:
    - acl
    - setterACL
    - override
    - dynamic
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

# Attributes
attributes:
  always_on_same_line:
    - "@IBAction"
    - "@NSManaged"
    - "@objc"
  always_on_line_above:
    - "@discardableResult"
    - "@available"
    - "@MainActor"

# Custom rules
custom_rules:
  no_print:
    name: "No Print Statements"
    regex: '(?<!#if DEBUG\n)print\('
    message: "Use proper logging instead of print()"
    severity: warning

# Strict mode - treat all warnings as errors in CI
# Uncomment for CI/CD pipeline
# strict: true

# Report format
reporter: "xcode"
